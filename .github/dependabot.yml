# Dependabot — monthly grouped version updates.
# Security updates stay on Dependabot security updates' default behavior.
# Group rules explicitly apply only to version updates.
version: 2
updates:
  - package-ecosystem: "gradle"
    directories:
      - "/./ApiDemos/project/java-app"
      - "/./ApiDemos/project/kotlin-app"
      - "/./WearOS"
      - "/./tutorials/java/CurrentPlaceDetailsOnMap"
      - "/./tutorials/java/MapWithMarker"
      - "/./tutorials/java/Polygons"
      - "/./tutorials/java/StyledMap"
      - "/./tutorials/kotlin/MapWithMarker"
      - "/./tutorials/kotlin/CurrentPlaceDetailsOnMap"
      - "/./tutorials/kotlin/Polygons"
      - "/./snippets"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "07:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "supply-chain"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "com.google.android.gms:play-services-basement"
        versions:
          - "17.6.0"
      - dependency-name: "com.android.tools.build:gradle"
        versions:
          - "4.1.2"
          - "4.1.3"
    groups:
      gradle-monthly:
        applies-to: "version-updates"
        patterns:
          - "*"